security:
    password_hashers:
        App\Entity\User: 'auto'

        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: 'auto'
            cost:      15

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        ROLE_SUPERADMIN: ROLE_ADMIN

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
                provider: app_user_provider
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~
            refresh_jwt:
                check_path: api_refresh_token
            entry_point: jwt
            logout:
                path: /api/logout
                invalidate_session: false

        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false


    # Only authentication is checked here. Who may use each endpoint is declared next to it with
    # #[IsGranted] (ROLE_USER, ROLE_ADMIN or a voter), and RouteAccessDeclarationTest fails when an
    # /api action declares none.
    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
