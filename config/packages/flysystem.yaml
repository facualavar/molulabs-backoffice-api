# One storage per purpose. Development keeps each in its own local directory; production keeps them
# all in the same S3 bucket, each under its own prefix.
when@dev:
    flysystem:
        storages:
            exports.storage:
                # The worker that writes the files and the web server that serves them can run as
                # different users: both must be able to enter the directories.
                directory_visibility: public
                local:
                    directory: '%app.storage_directory%/exports'

when@test:
    flysystem:
        storages:
            exports.storage:
                directory_visibility: public
                local:
                    directory: '%app.storage_directory%/exports'

when@prod:
    flysystem:
        storages:
            exports.storage:
                aws:
                    client: 'Aws\S3\S3Client'
                    bucket: '%env(AWS_S3_BUCKET)%'
                    prefix: 'exports'
